<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- App icon: a waveform with a cut-out section, the edit the app makes. -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="#2b3a4a"/>
  <g stroke-width="12" stroke-linecap="round" fill="none">
    <!-- kept parts -->
    <g stroke="#7fd1b9">
      <line x1="40" y1="112" x2="40" y2="144"/>
      <line x1="62" y1="84" x2="62" y2="172"/>
      <line x1="84" y1="60" x2="84" y2="196"/>
      <line x1="172" y1="72" x2="172" y2="184"/>
      <line x1="194" y1="96" x2="194" y2="160"/>
      <line x1="216" y1="116" x2="216" y2="140"/>
    </g>
    <!-- deleted part, faded -->
    <g stroke="#7fd1b9" stroke-opacity="0.3">
      <line x1="114" y1="92" x2="114" y2="164"/>
      <line x1="142" y1="104" x2="142" y2="152"/>
    </g>
  </g>
  <!-- cut marks -->
  <g stroke="#f2b84b" stroke-width="6" stroke-linecap="round">
    <line x1="99" y1="36" x2="99" y2="220"/>
    <line x1="157" y1="36" x2="157" y2="220"/>
  </g>
</svg>
