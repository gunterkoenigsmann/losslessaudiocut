# Snap package of losslessaudiocut: the GUI (`losslessaudiocut`) and the
# command line tool (`losslessaudiocut.cli`, the `lac` binary).
#
# Build locally with `snapcraft pack` (needs LXD or Multipass); CI builds it
# in .github/workflows/snap.yml, and .github/workflows/snap-publish.yml
# rebuilds and publishes it every week. docs/snap.md has the release steps.
name: losslessaudiocut
title: losslessaudiocut
summary: Cut audio recordings without re-encoding them
description: |
  losslessaudiocut deletes parts of AAC and ALAC (M4A), AC-3, MP3, Ogg (Vorbis, Opus, Speex),
  Matroska/WebM Opus, WAV, AIFF and FLAC recordings and splits them into tracks,
  without decoding and re-encoding the lossy audio: what is kept sounds
  exactly like the original.

  It shows the waveform of multi-hour recordings, plays the kept parts,
  suggests pauses and track boundaries, and edits the tags of each track.
  `losslessaudiocut.cli` does the same cuts from the command line.
license: GPL-3.0-or-later
website: https://github.com/gunterkoenigsmann/losslessaudiocut
source-code: https://github.com/gunterkoenigsmann/losslessaudiocut
issues: https://github.com/gunterkoenigsmann/losslessaudiocut/issues
icon: snap/gui/losslessaudiocut.svg
# Version and grade come from git (see override-pull below): a tagged commit
# is a release (grade stable), anything else a development build.
adopt-info: losslessaudiocut

base: core24
confinement: strict

# Each platform is built on its own architecture (GitHub's ubuntu-24.04-arm
# runners for arm64, see the workflows): snapcraft only builds the
# platforms whose architecture matches the machine it runs on.
platforms:
  amd64:
  arm64:

# cpal plays through ALSA. Inside the snap ALSA is pointed at the
# PulseAudio protocol (snap/local/asound.conf); these layouts put the
# snap's own ALSA plugins and data where libasound looks for them.
layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib
  /usr/share/alsa:
    bind: $SNAP/usr/share/alsa

apps:
  losslessaudiocut:
    command: bin/losslessaudiocut
    # GTK 3 and its dependencies come from the gnome-46-2404 content snap,
    # which also sets up fonts, themes, portals (file dialogs) and the
    # desktop, x11 and wayland plugs.
    extensions: [gnome]
    plugs: &plugs
      - home
      - removable-media
      - audio-playback
    environment: &environment
      ALSA_CONFIG_PATH: $SNAP/etc/asound.conf
  cli:
    command: bin/lac
    # Tab completion in bash, generated at build time (see override-build
    # of the losslessaudiocut part). Snaps cannot install manpages.
    completer: completions/losslessaudiocut.cli.bash
    # Not for GTK: the extension also puts the staged FFmpeg and ALSA
    # libraries on the library path, the same way as for the GUI.
    extensions: [gnome]
    plugs: *plugs
    environment: *environment

parts:
  # The Rust toolchain. With `rust-channel` the Rust plugin wants a rustup
  # binary in the build environment and did not find one there in CI,
  # neither the rustup snap nor Ubuntu's package. A part named rust-deps is
  # the plugin's documented alternative: it puts rustup's stable toolchain
  # into ~/.cargo/bin, which the plugin adds to PATH.
  rust-deps:
    plugin: nil
    build-packages:
      - curl
      - ca-certificates
    override-build: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --profile minimal --default-toolchain stable --no-modify-path
      "$HOME/.cargo/bin/cargo" --version

  losslessaudiocut:
    plugin: rust
    after: [rust-deps]
    # "none": take cargo from rust-deps. Left out, the plugin still runs
    # `rustup update stable` in its pull step, before rust-deps is built.
    rust-channel: none
    source: .
    # Compile against Ubuntu's own GTK 3 headers (libgtk-3-dev below), the
    # setup the normal CI job tests, instead of the gnome extension's SDK.
    # With the SDK on CMAKE_PREFIX_PATH, wxWidgets' CMake adds
    # -I/snap/gnome-46-2404-sdk/current/usr/include, whose <math.h> then
    # shadows libstdc++'s and breaks the build ("'isnan' was not declared"
    # in nanosvg). At run time the binary uses the GTK of the
    # gnome-46-2404 runtime, which is the same GTK 3 ABI, only newer.
    #
    # Linking must use Ubuntu's libraries throughout as well. The extension
    # puts the SDK's binutils first on PATH and its libraries on
    # LD_LIBRARY_PATH, where ld looks for the libraries that Ubuntu's
    # libgtk-3 needs in turn. On arm64 it then mixed the SDK's
    # libpangoft2 with Ubuntu's older libpango ("undefined reference to
    # `pango_font_description_get_features'").
    build-environment:
      - CMAKE_PREFIX_PATH: ""
      - PKG_CONFIG_PATH: ""
      - LD_LIBRARY_PATH: ""
      - PATH: "/usr/bin:$PATH"
    rust-path:
      - crates/lac-gui
      - crates/lac-cli
    override-build: |
      craftctl default
      # The bash completion of `losslessaudiocut.cli`: lac generates it
      # itself, for the name the snap gives it.
      mkdir -p "$CRAFT_PART_INSTALL/completions"
      "$CRAFT_PART_INSTALL/bin/lac" completions bash --bin-name losslessaudiocut.cli \
        > "$CRAFT_PART_INSTALL/completions/losslessaudiocut.cli.bash"
    override-pull: |
      craftctl default
      # Inside the LXD build the project is owned by another user, which
      # git refuses without safe.directory.
      git_() { git -c safe.directory='*' -C "$CRAFT_PROJECT_DIR" "$@"; }
      cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
      if tag="$(git_ describe --tags --exact-match 2>/dev/null)"; then
        # A release: the tag without its leading "v" (v1.2.0 -> 1.2.0).
        craftctl set version="${tag#v}"
        craftctl set grade=stable
      elif sha="$(git_ rev-parse --short=7 HEAD 2>/dev/null)"; then
        # A development build, e.g. 0.1.0+git20261104.1e4a3e4 (at most 32
        # characters, the store's limit).
        date="$(git_ log -1 --format=%cd --date=format:%Y%m%d)"
        craftctl set version="${cargo_version}+git${date}.${sha}"
        craftctl set grade=devel
      else
        # Built from a tarball without .git.
        craftctl set version="${cargo_version}"
        craftctl set grade=devel
      fi
    build-packages:
      - git
      # wxdragon downloads wxWidgets and builds it with CMake (Ninja if
      # present).
      - cmake
      - ninja-build
      # wxdragon-sys's build script downloads wxWidgets with reqwest and
      # native-tls (openssl-sys); build time only, nothing ends up in the snap.
      - libssl-dev
      - g++
      # bindgen (wxdragon-sys, ffmpeg-sys-next) needs libclang.
      - clang
      - libclang-dev
      - pkg-config
      # lac-decode links FFmpeg's decoders (FFmpeg 6.1 on Ubuntu 24.04).
      - libavcodec-dev
      - libavformat-dev
      - libavutil-dev
      # lac-playback: cpal's ALSA backend.
      - libasound2-dev
      # wxWidgets' GTK port (see build-environment above).
      - libgtk-3-dev
    stage-packages:
      - libavcodec60
      - libavformat60
      - libavutil58
      - libasound2t64
      - libasound2-data
      # The pulse plugin of ALSA (see snap/local/asound.conf).
      - libasound2-plugins
    prime:
      - "*"
      # libavcodec pulls in Ubuntu's librsvg. The gnome-46-2404 runtime has
      # a newer one, which its gdk-pixbuf SVG loader needs (with ours first
      # on the library path it failed: "undefined symbol:
      # rsvg_handle_get_pixbuf_and_error", so GTK could not draw SVG theme
      # icons). The runtime's librsvg keeps the same soname and ABI.
      - -usr/lib/*/librsvg-2.so*

  alsa-config:
    plugin: dump
    source: snap/local
    organize:
      asound.conf: etc/asound.conf
    stage:
      - etc/asound.conf
