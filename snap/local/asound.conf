# ALSA configuration inside the snap: send everything to the PulseAudio
# protocol, which both PulseAudio and PipeWire (pipewire-pulse) speak and
# which the `audio-playback` interface grants. cpal talks ALSA, and a
# confined app cannot open the sound card directly.
#
# Loaded through ALSA_CONFIG_PATH (see snapcraft.yaml) instead of the host's
# /usr/share/alsa/alsa.conf; the pulse plugin itself comes from
# libasound2-plugins in the snap, made visible at its compiled-in path by a
# layout.
pcm.!default {
    type pulse
    fallback "sysdefault"
    hint {
        show on
        description "Default ALSA output (PulseAudio or PipeWire)"
    }
}
ctl.!default {
    type pulse
    fallback "sysdefault"
}
