# Dependabot keeps the CI actions and the Cargo dependencies current.
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# GitHub Actions updates are grouped into at most one PR per week instead of
# one PR per action; each PR still has to pass the full CI, including the
# bit-exactness tests, before it is merged.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # Only major bumps (which may need code changes). Semver-compatible
  # updates of all crates, transitive ones included, come from the weekly
  # `cargo update` in .github/workflows/cargo-update.yml; Dependabot's cargo
  # updates would only cover the direct dependencies and race with it.
  # Security updates (Dependabot alerts) are not affected by this filter.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
