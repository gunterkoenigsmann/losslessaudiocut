# Release packages for Windows, macOS and Linux.
#
# Pushing a tag vX.Y.Z (matching `version` in Cargo.toml) builds
#
#   - Windows x64 and arm64: a zip to run without installing, and an
#     installer (Inno Setup),
#   - macOS arm64 (Apple silicon) and x86_64 (Intel): a .dmg with the .app,
#   - Linux x86_64 and aarch64: an AppImage,
#
# smoke-tests each package on a clean path (CLI on a fixture, GUI start),
# and attaches all of them plus SHA256SUMS.txt to the GitHub release of the
# tag, creating the release if it does not exist yet. A tag with a suffix
# (v1.2.0-rc1) becomes a pre-release. docs/release.md has the steps.
#
# On pull requests that touch the packaging, and when started by hand, the
# same packages are built and tested and kept as workflow artifacts, but
# nothing is released.
#
# The snap is not built here: snap-publish.yml builds the newest GitHub
# release for the stable channel. This workflow starts it once the release
# is published, so stable does not wait for the weekly run.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - packaging/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# One run per tag or PR; a newer push to the same PR replaces the old run,
# a tag run is never cancelled halfway through a release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      # Fails a tag that does not match Cargo.toml before anything is built.
      - id: version
        run: |
          version="$(packaging/version.sh "$GITHUB_REF")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "Version $version (pre-release: $pre)"

  linux:
    name: AppImage (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    # Cold build including wxWidgets is about 10 minutes; packaging 2.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      # Build dependencies as in ci.yml; librsvg2-bin renders the icon,
      # xvfb runs the GUI smoke test. Ubuntu 24.04 is the oldest runner
      # with FFmpeg >= 5.1, so the AppImage needs glibc 2.39 or newer.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavcodec-dev libavformat-dev libavutil-dev pkg-config clang \
            libgtk-3-dev ninja-build libasound2-dev librsvg2-bin xvfb
      - run: cargo build --release --locked -p lac-gui -p lac-cli
      - name: Package
        run: packaging/linux/appimage.sh "${{ needs.version.outputs.version }}" dist
      # Manpages and shell completions (bash, zsh, fish) as one tarball for
      # every Unix; they are text, so one architecture builds it. Its
      # share/ directory unpacks into ~/.local or /usr/local.
      - name: Manpages and shell completions
        if: matrix.arch == 'x86_64'
        run: |
          stage="$(mktemp -d)"
          packaging/shell-integration.sh target/release/lac "$stage"
          tarball="dist/losslessaudiocut-${{ needs.version.outputs.version }}-man-and-completions.tar.gz"
          tar -czf "$tarball" -C "$stage" share
          tar -tzvf "$tarball"
      # The CLI from inside the AppImage (it finds the bundled libraries by
      # its rpath), then the GUI: it must come up and keep running until
      # `timeout` ends it with status 124. Both run in a scratch directory
      # so nothing from the build tree is picked up.
      - name: Smoke test
        run: |
          set -x
          image="$(realpath dist/*.AppImage)"
          fixture="$(realpath crates/lac-container/tests/fixtures/mp3_cbr128_44k.mp3)"
          speex="$(realpath crates/lac-container/tests/fixtures/ogg_speex_16k.spx)"
          cd "$(mktemp -d)"
          "$image" --appimage-extract > /dev/null
          ldd squashfs-root/usr/bin/lac
          squashfs-root/usr/bin/lac --help
          squashfs-root/usr/bin/lac info "$fixture"
          squashfs-root/usr/bin/lac cut "$fixture" -o cut.mp3 --delete 0.5..1
          squashfs-root/usr/bin/lac info cut.mp3
          squashfs-root/usr/bin/lac detect "$fixture"
          squashfs-root/usr/bin/lac detect "$speex"
          test -s squashfs-root/usr/share/man/man1/losslessaudiocut.1
          test -s squashfs-root/usr/share/bash-completion/completions/lac
          grep -q '^MimeType=audio/mpeg;' squashfs-root/losslessaudiocut.desktop
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a timeout 20 "$image"
          status=$?
          echo "exit status: $status"
          test "$status" -eq 124
      - uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: DMG (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-latest }
          - { arch: x86_64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    # macOS runners sometimes wait long for capacity; this counts running
    # time only.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      # dylibbundler copies FFmpeg and its dependencies into the bundle;
      # librsvg (rsvg-convert) renders the icon.
      - name: Install build dependencies
        run: brew install ffmpeg pkg-config dylibbundler librsvg
      - run: cargo build --release --locked -p lac-gui -p lac-cli
      - name: Package
        run: packaging/macos/dmg.sh "${{ needs.version.outputs.version }}" dist
      # Runs the programs from the mounted disk image, the way a user gets
      # them. dmg.sh already checked that nothing links into Homebrew.
      - name: Smoke test
        run: |
          set -x
          fixture="$(pwd)/crates/lac-container/tests/fixtures/mp3_cbr128_44k.mp3"
          speex="$(pwd)/crates/lac-container/tests/fixtures/ogg_speex_16k.spx"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" dist/*.dmg
          app="$mnt/losslessaudiocut.app/Contents/MacOS"
          cd "$(mktemp -d)"
          "$app/lac" --help
          "$app/lac" info "$fixture"
          "$app/lac" cut "$fixture" -o cut.mp3 --delete 0.5..1
          "$app/lac" info cut.mp3
          "$app/lac" detect "$fixture"
          "$app/lac" detect "$speex"
          test -s "$app/../Resources/share/man/man1/lac.1"
          plutil -extract CFBundleDocumentTypes.0.LSItemContentTypes xml1 -o - "$app/../Info.plist"
          # The GUI must still be running after 15 s (macOS has no
          # `timeout`): a missing library or a crash ends it earlier.
          "$app/losslessaudiocut" &
          pid=$!
          sleep 15
          kill -0 "$pid"
          kill "$pid"
          wait "$pid" || true
          hdiutil detach "$mnt"
      - uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # ffmpeg: the platform part of BtbN's build names.
          - { arch: x64, runner: windows-latest, ffmpeg: win64 }
          - { arch: arm64, runner: windows-11-arm, ffmpeg: winarm64 }
    runs-on: ${{ matrix.runner }}
    # A cold wxWidgets build on Windows takes longest of all.
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    env:
      # Link the C runtime statically (wxdragon builds wxWidgets with the
      # matching /MT then), so users need no Visual C++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      # A prebuilt shared FFmpeg (headers, import libraries, DLLs), the
      # newest release branch, as in ci.yml. Unlike there, its bin folder is
      # not put on PATH: the smoke test must find the DLLs in the package.
      - name: Download FFmpeg
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.ffmpeg }}
        run: |
          $assets = gh release view latest -R BtbN/FFmpeg-Builds --json assets --jq '.assets[].name'
          $pattern = "^ffmpeg-n[0-9.]+-latest-$env:PLATFORM-gpl-shared-[0-9.]+\.zip$"
          $name = $assets | Where-Object { $_ -match $pattern } |
            Sort-Object { [version]($_ -replace '^ffmpeg-n([0-9.]+)-.*$', '$1') } | Select-Object -Last 1
          if (-not $name) { throw "no shared $env:PLATFORM build found in: $assets" }
          Write-Host "Using $name"
          gh release download latest -R BtbN/FFmpeg-Builds -p $name -O ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath "$env:RUNNER_TEMP"
          $dir = Join-Path "$env:RUNNER_TEMP" ($name -replace '\.zip$', '')
          "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
      # bindgen (ffmpeg-sys-next) loads libclang.dll into the build script,
      # so it must be built for the runner's own architecture. The x64
      # image has LLVM; on arm64 install the native (woa64) build.
      - name: libclang
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ matrix.arch }}" -eq "arm64") {
            $llvm = "20.1.8"
            gh release download "llvmorg-$llvm" -R llvm/llvm-project -p "LLVM-$llvm-woa64.exe" -O llvm.exe
            # NSIS installer: /S silent, /D target folder (must come last).
            Start-Process -Wait -FilePath .\llvm.exe -ArgumentList '/S', '/D=C:\llvm-arm64'
            $bin = 'C:\llvm-arm64\bin'
          } else {
            $bin = 'C:\Program Files\LLVM\bin'
          }
          if (-not (Test-Path "$bin\libclang.dll")) { throw "libclang.dll not found in $bin" }
          "LIBCLANG_PATH=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append
      # wxdragon builds wxWidgets with CMake and Ninja.
      - name: Ninja
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            $zip = if ("${{ matrix.arch }}" -eq "arm64") { 'ninja-winarm64.zip' } else { 'ninja-win.zip' }
            Invoke-WebRequest "https://github.com/ninja-build/ninja/releases/download/v1.12.1/$zip" -OutFile ninja.zip
            Expand-Archive ninja.zip -DestinationPath "$env:RUNNER_TEMP\ninja"
            "$env:RUNNER_TEMP\ninja" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            Invoke-WebRequest 'https://jrsoftware.org/download.php/is.exe' -OutFile is.exe
            Start-Process -Wait -FilePath .\is.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS'
          }
      - run: cargo build --release --locked -p lac-gui -p lac-cli
      - name: Package
        run: |
          packaging/windows/package.ps1 -Version "${{ needs.version.outputs.version }}" `
            -Arch ${{ matrix.arch }} -FfmpegDir $env:FFMPEG_DIR -OutDir dist
      # Unzips the zip and installs the installer silently, and runs the CLI
      # on a fixture and starts the GUI from each.
      - name: Smoke test
        run: |
          $fixture = Resolve-Path crates\lac-container\tests\fixtures\mp3_cbr128_44k.mp3
          $speex = Resolve-Path crates\lac-container\tests\fixtures\ogg_speex_16k.spx
          $work = Join-Path $env:RUNNER_TEMP smoke
          New-Item -ItemType Directory -Force $work | Out-Null
          Expand-Archive (Get-Item dist\*.zip).FullName -DestinationPath $work
          $zipDir = (Get-ChildItem $work -Directory | Select-Object -First 1).FullName

          $setup = (Get-Item dist\*-setup.exe).FullName
          $installDir = Join-Path $env:RUNNER_TEMP installed
          Start-Process -Wait -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir"
          if (-not (Test-Path "$installDir\losslessaudiocut.exe")) { throw "installer did not install to $installDir" }
          # The "Open with" task is on by default. The runner is admin, so
          # the installation is per machine: HKLM.
          $openWith = Get-ItemProperty 'HKLM:\Software\Classes\.mp3\OpenWithProgids'
          if ($null -eq $openWith.'losslessaudiocut.audio') { throw "no Open with entry for .mp3" }
          Get-ItemProperty 'HKLM:\Software\Classes\losslessaudiocut.audio\shell\open\command'

          foreach ($dir in @($zipDir, $installDir)) {
            Write-Host "--- $dir"
            Push-Location $work
            & "$dir\lac.exe" --help; if ($LASTEXITCODE -ne 0) { throw "lac --help failed" }
            & "$dir\lac.exe" info $fixture; if ($LASTEXITCODE -ne 0) { throw "lac info failed" }
            & "$dir\lac.exe" cut $fixture -o cut.mp3 --delete 0.5..1; if ($LASTEXITCODE -ne 0) { throw "lac cut failed" }
            & "$dir\lac.exe" info cut.mp3; if ($LASTEXITCODE -ne 0) { throw "lac info (cut) failed" }
            # detect decodes: the bundled FFmpeg must have these decoders.
            & "$dir\lac.exe" detect $fixture; if ($LASTEXITCODE -ne 0) { throw "lac detect (MP3) failed" }
            & "$dir\lac.exe" detect $speex; if ($LASTEXITCODE -ne 0) { throw "lac detect (Speex) failed" }
            # The completion script must load and register a completer.
            . "$dir\lac-completion.ps1"
            Remove-Item cut.mp3
            Pop-Location
            # The GUI must still be running after 15 s: a crash at start-up
            # ends it. (Missing DLLs would only show a dialog and keep it
            # "running", but the CLI above links the same DLLs and would
            # already have failed.)
            $gui = Start-Process -FilePath "$dir\losslessaudiocut.exe" -PassThru
            Start-Sleep -Seconds 15
            if ($gui.HasExited) { throw "GUI exited with code $($gui.ExitCode)" }
            Stop-Process -Id $gui.Id
          }
      - uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Create the release and upload its files.
      contents: write
      # Start snap-publish.yml.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      # For the hand-written notes in docs/release-notes/.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # A release that someone already created for the tag keeps its text
      # and only gets the files. Otherwise it is created with notes
      # generated from the merged PRs; if docs/release-notes/<tag>.md
      # exists, its text comes first and the generated list is appended.
      - name: Publish
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*
          else
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            notes="docs/release-notes/$TAG.md"
            if [ -f "$notes" ]; then flags+=(--notes-file "$notes"); fi
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag \
              --title "losslessaudiocut $VERSION" --generate-notes "${flags[@]}" dist/*
          fi
      # The snap follows the newest (non-pre-)release on the stable channel;
      # start its publish run now instead of waiting for Monday. Skipped
      # while that workflow does not exist, and a failure to start it does
      # not fail the release (the weekly run catches up).
      - name: Start snap publishing
        if: needs.version.outputs.prerelease == 'false'
        run: |
          if gh workflow view snap-publish.yml -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh workflow run snap-publish.yml -R "$GITHUB_REPOSITORY" --ref main ||
              echo "::warning::Could not start snap-publish.yml; the weekly run will publish the release."
          else
            echo "No snap-publish.yml workflow; skipping."
          fi
