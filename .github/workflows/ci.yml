name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by cargo-update.yml on its branch: a PR opened with GITHUB_TOKEN
  # triggers no pull_request runs, but a dispatch is allowed.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    # Typically under 15 s.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Security advisories (RustSec), licenses and crate sources of all
  # dependencies, configured in deny.toml.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Short fuzzing run of every demuxer/muxer target (see fuzz/Cargo.toml):
  # malformed files must give an error, never a panic, hang or OOM. The
  # committed test fixtures are the seed corpus. A crash uploads the
  # input that triggered it; turn that into a regression test.
  fuzz:
    name: fuzz (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [open_any, wav, aiff, flac, ogg, mp3, mp4, ac3, tags]
    runs-on: ubuntu-latest
    # 2 minutes of fuzzing plus a cold nightly build of lac-container.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The prebuilt cargo-fuzz is a musl binary and would default to
      # building for musl, which has no ASan runtime; name the target.
      # -max_len keeps inputs small so each run is fast; the seeds are
      # cut to that length, which still keeps their headers. -timeout
      # turns a hang (a parser loop that never advances) into a failure.
      - name: Fuzz
        working-directory: fuzz
        run: |
          mkdir -p corpus/${{ matrix.target }}
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} corpus/${{ matrix.target }} \
            ../crates/lac-container/tests/fixtures -- \
            -max_total_time=120 -max_len=8192 -timeout=10 -rss_limit_mb=2048
      - name: Upload crashing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A warm-cache run takes 1-3 minutes per OS (Nov 2026). A cold cache
    # also builds wxWidgets from source for lac-gui (about 5 minutes on a
    # Linux runner, more on Windows). The limit leaves room for that, so
    # only a real hang hits it. It counts running time only: a job still
    # waiting for a runner is not affected.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # ffmpeg, the reference flac tool, oggdec (libvorbisfile) and mpg123
      # are the independent decoders for cross-checks; groff checks the
      # generated manpages. They are installed (and therefore required) on Linux;
      # on macOS and Windows the cross-checks skip themselves to keep CI fast.
      - name: Install reference tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg flac vorbis-tools mpg123 groff-base
      # lac-decode links FFmpeg's libraries (decoders only, see AGENTS.md);
      # ffmpeg-sys-next generates its bindings with bindgen (libclang).
      - name: Install FFmpeg development files (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libavfilter-dev libavdevice-dev pkg-config clang
      - name: Install FFmpeg development files (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config
      # Windows: a prebuilt shared FFmpeg (headers, import libraries, DLLs).
      # The DLLs go on PATH so that the test binaries find them.
      - name: Install FFmpeg development files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # BtbN's "latest" release holds builds of the newest release
          # branches, named ffmpeg-nX.Y-latest-win64-gpl-shared-X.Y.zip;
          # take the newest one instead of hard-coding a version.
          $assets = gh release view latest -R BtbN/FFmpeg-Builds --json assets --jq '.assets[].name'
          $name = $assets | Where-Object { $_ -match '^ffmpeg-n[0-9.]+-latest-win64-gpl-shared-[0-9.]+\.zip$' } |
            Sort-Object { [version]($_ -replace '^ffmpeg-n([0-9.]+)-.*$', '$1') } | Select-Object -Last 1
          if (-not $name) { throw "no shared win64 build found in: $assets" }
          Write-Host "Using $name"
          gh release download latest -R BtbN/FFmpeg-Builds -p $name -O ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath "$env:RUNNER_TEMP"
          $dir = Join-Path "$env:RUNNER_TEMP" ($name -replace '\.zip$', '')
          "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      # lac-gui: wxdragon downloads and builds wxWidgets with CMake (already
      # on all runners); on Linux it needs GTK 3. Ninja makes that build faster.
      # lac-playback: cpal talks to ALSA on Linux. The tests never open a
      # device (they drive the audio callback themselves), so no sound
      # server is needed.
      # wxWidgets links the system libjpeg and libtiff; on Ubuntu 26.04
      # libgtk-3-dev no longer pulls in their development files.
      - name: Install GUI and audio build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libgtk-3-dev libjpeg-dev libtiff-dev ninja-build libasound2-dev
      # The cache holds ffmpeg-sys-next's build output, i.e. bindings and
      # feature flags for the FFmpeg it was built against. Restored onto a
      # runner with another FFmpeg (ubuntu-latest moving from 24.04 with
      # FFmpeg 6.1 to 26.04 with FFmpeg 8.0, a new Homebrew or BtbN build),
      # ffmpeg-next then calls functions that FFmpeg no longer has, e.g.
      # avcodec_close, and linking fails. So the FFmpeg version is part of
      # the cache key, and the cache is restored only after FFmpeg is
      # installed.
      - name: FFmpeg version for the cache key
        id: ffmpeg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            version=$(basename "$FFMPEG_DIR")
          else
            version=$(pkg-config --modversion libavcodec)
          fi
          echo "FFmpeg (libavcodec) $version on $ImageOS"
          echo "key=$ImageOS-libavcodec-$version" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.ffmpeg.outputs.key }}
      - name: Require cross-checks
        if: runner.os == 'Linux'
        shell: bash
        run: echo "LAC_REQUIRE_TOOLS=1" >> "$GITHUB_ENV"
      - run: cargo clippy --workspace --all-targets
      # Tests take under 30 s; a hung test (e.g. a demuxer loop that never
      # advances) fails here with its log instead of eating the job limit.
      - run: cargo test --workspace
        timeout-minutes: 10
      - name: Documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
