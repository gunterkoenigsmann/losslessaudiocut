name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    # Typically under 15 s.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A warm-cache run takes 1-3 minutes per OS (Nov 2026). The limit leaves
    # room for cold-cache builds, so only a real hang hits it. It counts
    # running time only: a job still waiting for a runner is not affected.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # ffmpeg, the reference flac tool, oggdec (libvorbisfile) and mpg123
      # are the independent decoders for cross-checks. They are installed (and therefore required) on Linux;
      # on macOS and Windows the cross-checks skip themselves to keep CI fast.
      - name: Install reference tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg flac vorbis-tools mpg123
      # lac-decode links FFmpeg's libraries (decoders only, see AGENTS.md);
      # ffmpeg-sys-next generates its bindings with bindgen (libclang).
      - name: Install FFmpeg development files (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libavfilter-dev libavdevice-dev pkg-config clang
      - name: Install FFmpeg development files (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config
      # Windows: a prebuilt shared FFmpeg (headers, import libraries, DLLs).
      # The DLLs go on PATH so that the test binaries find them.
      - name: Install FFmpeg development files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # BtbN's "latest" release holds builds of the newest release
          # branches, named ffmpeg-nX.Y-latest-win64-gpl-shared-X.Y.zip;
          # take the newest one instead of hard-coding a version.
          $assets = gh release view latest -R BtbN/FFmpeg-Builds --json assets --jq '.assets[].name'
          $name = $assets | Where-Object { $_ -match '^ffmpeg-n[0-9.]+-latest-win64-gpl-shared-[0-9.]+\.zip$' } |
            Sort-Object { [version]($_ -replace '^ffmpeg-n([0-9.]+)-.*$', '$1') } | Select-Object -Last 1
          if (-not $name) { throw "no shared win64 build found in: $assets" }
          Write-Host "Using $name"
          gh release download latest -R BtbN/FFmpeg-Builds -p $name -O ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath "$env:RUNNER_TEMP"
          $dir = Join-Path "$env:RUNNER_TEMP" ($name -replace '\.zip$', '')
          "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Require cross-checks
        if: runner.os == 'Linux'
        shell: bash
        run: echo "LAC_REQUIRE_TOOLS=1" >> "$GITHUB_ENV"
      - run: cargo clippy --workspace --all-targets
      # Tests take under 30 s; a hung test (e.g. a demuxer loop that never
      # advances) fails here with its log instead of eating the job limit.
      - run: cargo test --workspace
        timeout-minutes: 10
      - name: Documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
