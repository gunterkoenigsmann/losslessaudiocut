name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # ffmpeg, the reference flac tool, oggdec (libvorbisfile) and mpg123
      # are the independent decoders for cross-checks. They are installed (and therefore required) on Linux;
      # on macOS and Windows the cross-checks skip themselves to keep CI fast.
      - name: Install reference tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg flac vorbis-tools mpg123
      # lac-decode links FFmpeg's libraries (decoders only, see AGENTS.md);
      # ffmpeg-sys-next generates its bindings with bindgen (libclang).
      - name: Install FFmpeg development files (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libavfilter-dev libavdevice-dev pkg-config clang
      - name: Install FFmpeg development files (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config
      # Windows: a prebuilt shared FFmpeg (headers, import libraries, DLLs).
      # The DLLs go on PATH so that the test binaries find them.
      - name: Install FFmpeg development files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath "$env:RUNNER_TEMP"
          $dir = (Get-ChildItem "$env:RUNNER_TEMP" -Directory -Filter "ffmpeg-n7.1*").FullName
          "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Require cross-checks
        if: runner.os == 'Linux'
        shell: bash
        run: echo "LAC_REQUIRE_TOOLS=1" >> "$GITHUB_ENV"
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: Documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
