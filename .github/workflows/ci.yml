name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    # Typically under 15 s.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A warm-cache run takes 1-3 minutes per OS (Nov 2026). The limit leaves
    # room for cold-cache builds, so only a real hang hits it. It counts
    # running time only: a job still waiting for a runner is not affected.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # ffmpeg, the reference flac tool, oggdec (libvorbisfile) and mpg123
      # are the independent decoders for cross-checks. They are installed (and therefore required) on Linux;
      # on macOS and Windows the cross-checks skip themselves to keep CI fast.
      - name: Install reference tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg flac vorbis-tools mpg123
      - name: Require cross-checks
        if: runner.os == 'Linux'
        shell: bash
        run: echo "LAC_REQUIRE_TOOLS=1" >> "$GITHUB_ENV"
      - run: cargo clippy --workspace --all-targets
      # Tests take under 30 s; a hung test (e.g. a demuxer loop that never
      # advances) fails here with its log instead of eating the job limit.
      - run: cargo test --workspace
        timeout-minutes: 10
      - name: Documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
