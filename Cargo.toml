[workspace]
resolver = "3"
members = ["crates/lac-core", "crates/lac-container", "crates/lac-app", "crates/lac-decode", "crates/lac-peaks", "crates/lac-analysis", "crates/lac-cli", "crates/lac-gui", "crates/lac-playback", "crates/lac-python"]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/gunterkoenigsmann/losslessaudiocut"

[workspace.dependencies]
lac-core = { path = "crates/lac-core" }
lac-container = { path = "crates/lac-container" }
# Without their default features (playback through the sound card), which
# only the GUI turns on: the CLI and the Python package need no audio library.
lac-app = { path = "crates/lac-app", default-features = false }
lac-peaks = { path = "crates/lac-peaks" }
lac-analysis = { path = "crates/lac-analysis" }
lac-decode = { path = "crates/lac-decode" }
lac-playback = { path = "crates/lac-playback", default-features = false }
thiserror = "2.0.21"
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
proptest = "1.12.0"
directories = "6.0.0"
cpal = "0.18.2"
rtrb = "0.4.1"
midir = "0.11.1"
glow = "0.18.0"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
