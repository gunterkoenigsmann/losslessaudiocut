[workspace]
resolver = "3"
members = ["crates/lac-core", "crates/lac-container", "crates/lac-app", "crates/lac-decode", "crates/lac-peaks", "crates/lac-cli", "crates/lac-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/gunterkoenigsmann/losslessaudiocut"

[workspace.dependencies]
lac-core = { path = "crates/lac-core" }
lac-container = { path = "crates/lac-container" }
lac-app = { path = "crates/lac-app" }
lac-peaks = { path = "crates/lac-peaks" }
lac-decode = { path = "crates/lac-decode" }
thiserror = "2.0.21"
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
proptest = "1.12.0"
directories = "6.0.0"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
