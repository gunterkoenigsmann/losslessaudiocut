# Fuzz targets for the demuxers and muxers of lac-container, run with
# cargo-fuzz (needs a nightly toolchain):
#
#     cargo +nightly fuzz run <target> fuzz/seeds/<target>
#
# The crate has its own empty [workspace] so that the normal workspace
# build and `cargo test --workspace` stay on stable and never see it.
[package]
name = "lac-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lac-core = { path = "../crates/lac-core" }
lac-container = { path = "../crates/lac-container" }

[workspace]

[[bin]]
name = "open_any"
path = "fuzz_targets/open_any.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wav"
path = "fuzz_targets/wav.rs"
test = false
doc = false
bench = false

[[bin]]
name = "flac"
path = "fuzz_targets/flac.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ogg"
path = "fuzz_targets/ogg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mp3"
path = "fuzz_targets/mp3.rs"
test = false
doc = false
bench = false
