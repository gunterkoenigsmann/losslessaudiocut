[package]
name = "lac-python"
description = "Python bindings of losslessaudiocut (the `losslessaudiocut` package on PyPI), built with maturin."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# The extension module `losslessaudiocut._native` (see pyproject.toml).
name = "_native"
crate-type = ["cdylib"]
# A test binary would have to link libpython; the Python tests in tests/
# exercise this crate through the built package instead (pytest).
test = false
doctest = false

[dependencies]
lac-core.workspace = true
lac-app.workspace = true
lac-analysis.workspace = true
lac-decode.workspace = true
lac-cli = { path = "../lac-cli" }
# abi3-py310: one wheel per platform for every CPython from 3.10 on.
# generate-import-lib: Windows links python3.dll without a Python
# installation that ships its import library.
pyo3 = { version = "0.30.1", features = ["abi3-py310", "generate-import-lib"] }

[build-dependencies]
pyo3-build-config = "0.30.1"

[lints]
workspace = true
