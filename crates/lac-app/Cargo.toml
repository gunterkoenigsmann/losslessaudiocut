[package]
name = "lac-app"
description = "Use cases of losslessaudiocut shared by the command line and the GUI: opening files, time input, cutting."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["audio-output"]
## Playing through the sound card (`playback::open_player`). Front ends that
## only cut and analyse (the CLI, the Python package) leave it out and so
## need no audio system library.
audio-output = ["lac-playback/device"]

[dependencies]
lac-core.workspace = true
lac-container.workspace = true
lac-decode.workspace = true
lac-peaks.workspace = true
lac-analysis.workspace = true
lac-playback.workspace = true
thiserror.workspace = true
clap.workspace = true
directories.workspace = true

[lints]
workspace = true

[dev-dependencies]
anyhow.workspace = true
