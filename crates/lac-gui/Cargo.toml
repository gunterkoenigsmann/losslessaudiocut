[package]
name = "lac-gui"
description = "Graphical user interface of losslessaudiocut (wxWidgets via wxdragon)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "losslessaudiocut"
path = "src/main.rs"

[dependencies]
lac-analysis.workspace = true
lac-app.workspace = true
lac-core.workspace = true
lac-peaks.workspace = true
lac-playback.workspace = true
# OpenGL function loader for the video pane's GPU renderer (video_gl.rs);
# the functions come from wxWidgets' GL context.
glow.workspace = true
# MIDI input from control surfaces (issue #95, see surface.rs).
midir.workspace = true
# Without default features: they pull in the Linux tray icon library
# (appindicator) and image formats we do not use. `aui` gives the dockable
# panes (toolbar and friends, see `panes.rs`).
wxdragon = { version = "0.9.24", default-features = false, features = ["aui"] }

# The video pane's Metal renderer on macOS (video_metal.rs, issue #172).
# objc2 is already in the tree there through cpal.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSGraphics", "objc2-quartz-core", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-metal = "0.3.2"
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "CATransaction", "objc2-metal", "objc2-core-foundation"] }

[build-dependencies]
# Compiles the Windows resources (icon, version, manifest) with rc.exe or
# windres; see build.rs. Unused on other targets.
embed-resource = "3.0.12"

# The workspace forbids `unsafe`; the GPU calls of the video pane's
# renderers (video_gl.rs, video_metal.rs) are FFI and the only places in this
# crate allowed to use it (AGENTS.md), with `#[allow(unsafe_code)]` and a `// SAFETY:`
# comment per block.
[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
