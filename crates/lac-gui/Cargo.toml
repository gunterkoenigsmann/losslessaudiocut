[package]
name = "lac-gui"
description = "Graphical user interface of losslessaudiocut (wxWidgets via wxdragon)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "losslessaudiocut"
path = "src/main.rs"

[dependencies]
lac-app.workspace = true
lac-core.workspace = true
lac-peaks.workspace = true
lac-playback.workspace = true
# Without default features: they pull in the Linux tray icon library
# (appindicator) and image formats we do not use. `aui` gives the dockable
# panes (toolbar and friends, see `panes.rs`).
wxdragon = { version = "0.9.24", default-features = false, features = ["aui"] }

[lints]
workspace = true
